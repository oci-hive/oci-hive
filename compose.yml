services:
  registry:
    image: docker.io/library/registry:2.8.2
    container_name: oci-hive-registry
    restart: always
    ports:
      - 5000:5000
    volumes:
      - registry-vol:/var/lib/registry
      - ./services/registry/config.yml:/etc/docker/registry/config.yml

  ui:
    image: registry.serhiicho.com/oci-hive:ui
    build:
      dockerfile: services/ui/Dockerfile
    container_name: oci-hive-ui
    restart: always
    environment:
      APP_ENV: $APP_ENV
    ports:
      - 8080:8080
      - 5173:5173
    volumes:
      - ./services/ui/src:/var/www/html
      - ui-go-packages:/go/pkg/mod/
    tty: true
    stop_grace_period: 0s
    stdin_open: true
    depends_on:
      - registry

volumes:
  registry-vol:
    driver: local
  ui-go-packages:
    driver: local
