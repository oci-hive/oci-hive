services:
  registry:
    image: docker.io/library/registry:2.8.2
    container_name: oci-hive-registry
    restart: always
    ports:
      - 5000:5000
    volumes:
      - registry-vol:/var/lib/registry
      - ./services/registry/config.yml:/etc/docker/registry/config.yml

  ui:
    image: registry.serhiicho.com/registry-hub:ui
    build:
      dockerfile: services/ui/Dockerfile
    container_name: oci-hive-ui
    restart: always
    ports:
      - 8080:8080
    volumes:
      - ./services/ui/src:/var/www/html
      - ui-go-packages:/go/pkg/mod/
    tty: true
    stdin_open: true
    depends_on:
      - registry

  go-dev:
    image: registry.serhiicho.com/go-lsp:1.27-alpine
    container_name: oci-hive-go-dev
    working_dir: ${PWD}/services/ui/src
    volumes:
      - ./services/ui/src:${PWD}/services/ui/src:z
      - go-dev-mod:/go/pkg/mod
      - go-dev-cache:/root/.cache/go-build
    command: ["sleep", "infinity"]
    tty: true
    stdin_open: true

volumes:
  registry-vol:
    driver: local
  ui-go-packages:
    driver: local
  go-dev-mod:
    driver: local
  go-dev-cache:
    driver: local
